# Dependency Resolution Settings
minimumReleaseAge: 4320 # 3 days
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320 # 3 days

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

# Other Settings
catalogMode: strict
savePrefix: "~"

# Catalogs

# Independently versioned packages
catalog:
  "@eslint/js": ~10.0.1
  "@types/node": ~24.19.1
  bootstrap: ~5.3.8
  eslint: ~10.11.0
  eslint-config-prettier: ~10.1.8
  eslint-plugin-ban: ~2.0.0
  playwright: ~1.63.0
  prettier: ~3.9.9
  prettier-plugin-organize-imports: ~4.3.0
  rxjs: ~7.8.2
  tslib: ~2.8.1
  typescript: ~6.0.3
  typescript-eslint: ~8.71.0
  vite: ~8.3.2

# Version-locked families that must bump together
catalogs:
  angular:
    "@angular/cdk": ~22.2.0
    "@angular/common": ~22.2.0
    "@angular/compiler": ~22.2.0
    "@angular/compiler-cli": ~22.2.0
    "@angular/core": ~22.2.0
    "@angular/forms": ~22.2.0
    "@angular/platform-browser": ~22.2.0
    "@angular/router": ~22.2.0

  angular-cli:
    "@angular/build": ~22.2.0
    "@angular/cli": ~22.2.0

  angular-eslint:
    "@angular-eslint/builder": ~22.5.0
    angular-eslint: ~22.5.0

  vitest:
    "@vitest/browser-playwright": ~5.0.2
    "@vitest/coverage-v8": ~5.0.2
    "@vitest/expect": ~5.0.2
    "@vitest/ui": ~5.0.1
    vitest: ~5.0.2
