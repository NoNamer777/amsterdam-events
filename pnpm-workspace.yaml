# Dependency Resolution Settings
minimumReleaseAge: 4320
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 4320

# CLI Settings
engineStrict: true

# Build Settings
allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  lmdb: false
  msgpackr-extract: false

# Other Settings
catalogMode: strict
savePrefix: "~"

# Catalogs

# Independently versioned packages
catalog:
  '@eslint/js': ~10.0.1
  '@types/node': ~24.13.3
  bootstrap: ~5.3.8
  eslint: ~10.9.1
  eslint-config-prettier: ~10.1.8
  eslint-plugin-ban: ~2.0.0
  playwright: ~1.62.1
  prettier: ~3.9.6
  prettier-plugin-organize-imports: ~4.3.0
  rxjs: ~7.8.2
  tslib: ~2.8.1
  typescript: ~6.0.3
  typescript-eslint: ~8.68.0
  vite: ~8.2.2

# Version-locked families that must bump together
catalogs:
  angular:
    '@angular/cdk': ~22.1.4
    '@angular/common': ~22.1.4
    '@angular/compiler': ~22.1.4
    '@angular/compiler-cli': ~22.1.4
    '@angular/core': ~22.1.4
    '@angular/forms': ~22.1.4
    '@angular/platform-browser': ~22.1.4
    '@angular/router': ~22.1.4

  angular-cli:
    '@angular/build': ~22.1.6
    '@angular/cli': ~22.1.6

  angular-eslint:
    '@angular-eslint/builder': ~22.1.0
    angular-eslint: ~22.1.0

  vitest:
    '@vitest/browser-playwright': ~4.1.11
    '@vitest/coverage-v8': ~4.1.11
    '@vitest/ui': ~4.1.11
    vitest: ~4.1.11
