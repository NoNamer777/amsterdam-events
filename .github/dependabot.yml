version: 2
updates:
    - package-ecosystem: 'github-actions'
      directory: '/'
      schedule:
          interval: 'daily'

      # One PR for all minor/patch action bumps; majors get their own PR each.
      groups:
          actions:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'

    - package-ecosystem: 'npm'
      directory: '/'
      schedule:
          interval: 'daily'
      open-pull-requests-limit: 20

      # Groups mirror the named catalogs in pnpm-workspace.yaml: a bump for a
      # version-locked family lands as one PR editing that family's catalog.
      # Locked families group every update type (a major must move as one unit);
      # the default catalog groups only minor/patch and splits majors into their
      # own per-package PRs.
      groups:
          # catalog: angular (+ catalog: angular-cli)
          angular:
              patterns:
                  - '@angular/*'

          # catalog: angular-eslint
          angular-eslint:
              patterns:
                  - '@angular-eslint/*'
                  - 'angular-eslint'

          # catalog: vitest
          vitest:
              patterns:
                  - '@vitest/*'
                  - 'vitest'

          # default catalog: everything not in a version-locked family
          default-catalog:
              patterns:
                  - '*'
              update-types:
                  - 'minor'
                  - 'patch'
